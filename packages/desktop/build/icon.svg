<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#c06bff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a1040" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px tile centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- π: top bar + two legs, the right one curling out -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="84">
    <path d="M300 372 C340 340 380 332 430 332 L724 332"/>
    <path d="M438 340 C438 470 420 590 352 700"/>
    <path d="M612 340 L612 612 C612 676 642 704 690 704 C712 704 730 698 744 688"/>
  </g>
</svg>
